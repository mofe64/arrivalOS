spring:
  application:
    name: arrivalOs
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arrivalos}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

arrivalos:
  app:
    base-url: ${ARRIVALOS_APP_BASE_URL:http://localhost:3000}
  email:
    provider: ${ARRIVALOS_EMAIL_PROVIDER:smtp}
    from: ${ARRIVALOS_EMAIL_FROM:ArrivalOS <no-reply@arrivalos.local>}
    resend-api-key: ${RESEND_API_KEY:}
  auth:
    jwt-secret: ${ARRIVALOS_JWT_SECRET}
  cors:
    allowed-origins: ${ARRIVALOS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
