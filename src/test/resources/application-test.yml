spring:
  mail:
    host: localhost
    port: 1025
  datasource:
    url: jdbc:h2:mem:arrivalos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

arrivalos:
  app:
    base-url: http://localhost:3000
  email:
    provider: noop
    from: ArrivalOS <no-reply@arrivalos.local>
  auth:
    jwt-secret: arrivalos-test-secret-must-be-at-least-32-bytes
